<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中秋餐會 座位與餐點登記</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

<header>
  <h1>🌕 中秋餐會 座位與餐點登記</h1>
  <p>兩人一組選桌、選套餐；找不到搭檔的同仁可以交由福委會安排。</p>
</header>

<div class="entry">
  <button class="entry-card main" id="btnPair">
    <span class="ec-icon">👫</span>
    <span><b>兩人一組登記</b><small>已經找好搭檔，一起選桌與套餐</small></span>
  </button>
  <button class="entry-card" id="btnSolo">
    <span class="ec-icon">🙋</span>
    <span><b>找不到搭檔</b><small>交由福委會幫你配對、安排座位</small></span>
  </button>
</div>

<div class="banner" id="netBanner"></div>

<h2>桌次與剩餘座位 <small id="seatsLeft"></small></h2>
<div class="toolbar">
  <button class="chipbtn" data-filter="all" aria-pressed="true">全部</button>
  <button class="chipbtn" data-filter="4">4 人桌</button>
  <button class="chipbtn" data-filter="6">6 人桌</button>
  <button class="chipbtn" data-filter="8">8 人桌</button>
  <button class="chipbtn" data-filter="free">尚有空位</button>
  <span class="spacer"></span>
  <button class="ghost" id="btnCancel">取消我的登記</button>
</div>
<div class="grid" id="grid"><div class="loading">載入中…</div></div>

</div><!--/wrap-->

<!-- ============ 登記對話框 ============ -->
<dialog id="dlg">
 <form class="dlg-body" id="form" onsubmit="return false">
  <div class="dlg-head">
    <h3 id="dlgTitle">登記</h3>
    <button type="button" class="x" data-close>&times;</button>
  </div>
  <p class="dlg-sub" id="dlgSub"></p>

  <div class="field-top" id="tableField">
    <label class="field-label" for="tableSel">桌次</label>
    <select id="tableSel"></select>
  </div>

  <div id="groups"></div>
  <button type="button" class="ghost wide" id="btnAddGroup">+ 同桌再加一組</button>

  <p class="msg" id="msg"></p>

  <div class="dlg-foot">
    <button type="button" class="ghost" data-close>取消</button>
    <button type="button" class="primary" id="btnSubmit">送出登記</button>
  </div>
 </form>
</dialog>

<!-- ============ 登記完成（必須按確認才關閉） ============ -->
<dialog id="dlgDone">
 <div class="dlg-body">
  <div class="done-top">
    <div class="done-icon">✅</div>
    <h3 style="margin:4px 0 0">登記完成</h3>
  </div>
  <div class="codebox">
    <div class="code-label">你的預約碼</div>
    <div class="bigcode" id="doneCode"></div>
    <button type="button" class="ghost" id="btnCopy">複製預約碼</button>
  </div>
  <p class="dlg-sub" style="text-align:center;margin:0">請截圖或記下預約碼，之後要取消登記時會用到。</p>
  <div class="done-detail" id="doneDetail"></div>
  <div class="dlg-foot">
    <button type="button" class="primary wide" id="btnDoneOk">確認</button>
  </div>
 </div>
</dialog>

<!-- ============ 取消對話框 ============ -->
<dialog id="dlgCancel">
 <div class="dlg-body">
  <div class="dlg-head">
    <h3>取消登記</h3>
    <button type="button" class="x" data-close>&times;</button>
  </div>
  <p class="dlg-sub">輸入登記完成時拿到的<b>預約碼</b>，會一併取消該筆登記的所有人。</p>
  <input type="text" id="cancelCode" placeholder="例如 K7F2QX" style="text-transform:uppercase">
  <p class="msg" id="cancelMsg"></p>
  <div class="dlg-foot">
    <button type="button" class="ghost" data-close>關閉</button>
    <button type="button" class="primary" id="btnDoCancel">確認取消</button>
  </div>
 </div>
</dialog>

<script src="config.js"></script>
<script src="shared.js"></script>
<script>
let filter = 'all';
let busy = false;
let formMode = 'pair';   // 'pair' | 'solo'
let ready = loadCachedBookings();   // 有上次的資料就先顯示，不用等後端
let updating = false;

/* ---------------- 桌次 ---------------- */

function render() {
  const left = TOTAL_SEATS - bookings.filter(b => b.tableId).length;
  $('#seatsLeft').textContent = !ready ? '讀取中…'
    : `全場剩 ${left} 席${updating ? '・更新中…' : ''}`;

  if (!ready) {
    // 第一次開啟、還沒有任何資料：先把桌子畫出來，按鈕暫時不能按
    $('#grid').innerHTML = TABLES.map(t => `<div class="table-card">
      <div class="tc-head">
        <div><div class="tc-name">${t.id} 桌</div><div class="tc-size">${t.size} 人桌・${t.size / 2} 組</div></div>
        <span class="pill no">讀取中…</span>
      </div>
      <div class="seats">${'<span class="seat"></span>'.repeat(t.size)}</div>
      <div class="occupants"><i class="muted">讀取中…</i></div>
      <div class="tc-actions"><button class="primary" disabled>讀取中…</button></div>
    </div>`).join('');
    return;
  }

  const list = TABLES.filter(t => {
    if (filter === 'all') return true;
    if (filter === 'free') return pairSlots(t.id) > 0;
    return String(t.size) === filter;
  });

  $('#grid').innerHTML = list.map(t => {
    const used = seatsUsed(t.id);
    const left = t.size - used;
    const slots = Math.floor(left / 2);
    const pillCls = slots === 0 ? 'no' : slots === 1 ? 'low' : 'ok';
    const people = bookings.filter(b => b.tableId === t.id);

    return `<div class="table-card ${slots === 0 ? 'full' : ''}">
      <div class="tc-head">
        <div><div class="tc-name">${t.id} 桌</div><div class="tc-size">${t.size} 人桌・${t.size / 2} 組</div></div>
        <span class="pill ${pillCls}">${left === 0 ? '已額滿' : `剩 ${left} 位`}</span>
      </div>
      <div class="seats">${
        Array.from({ length: t.size }, (_, i) =>
          `<span class="seat ${i < used ? 'taken' : ''}"></span>`).join('')
      }</div>
      <div class="occupants">${
        people.length ? pairsOf(people).map(p => pairLabel(p, false)).join('<br>') : '<i class="muted">尚無人登記</i>'
      }</div>
      <div class="tc-actions">
        <button class="primary" data-book="${t.id}" ${slots === 0 ? 'disabled' : ''}>
          ${slots === 0 ? (left ? '不足一組' : '額滿') : `登記這桌（可再 ${slots} 組）`}</button>
      </div>
    </div>`;
  }).join('') || '<div class="loading">沒有符合條件的桌次</div>';
}

async function refresh() {
  updating = true;
  render();
  const ok = await syncBookings();
  ready = ready || ok;
  updating = false;
  render();
}

/* ---------------- 登記表單 ---------------- */

const dlg = $('#dlg');
let uidSeq = 0;

function fieldHTML(item) {
  const name = 'f' + (++uidSeq);
  const widget = item.options.length <= 4
    ? `<div class="opts">${item.options.map(o =>
        `<label class="opt"><input type="radio" name="${name}" value="${esc(o)}"><span>${esc(o)}</span></label>`
      ).join('')}</div>`
    : `<select><option value="">請選擇</option>${item.options.map(o =>
        `<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`;
  return `<div class="field" data-field="${item.key}">
    <div class="field-label">${esc(item.label)}</div>${widget}
    <div class="skip-note">${esc(item.skipNote || '此項不需選擇')}</div>
  </div>`;
}

function readFieldEl(f) {
  const sel = f.querySelector('select');
  if (sel) return sel.value;
  return f.querySelector('input:checked')?.value || '';
}

// 產生一組的表單。solo = 找不到搭檔（一人，所有項目都是個人偏好）
function groupHTML(solo) {
  const count = solo ? 1 : 2;
  const perOf = it => solo ? 'person' : it.per;
  const tag = i => solo ? '' : `<span class="mtag">${'AB'[i]}</span>`;

  let html = `<fieldset class="group${solo ? ' solo' : ''}">`;
  if (!solo) {
    html += `<div class="group-head"><span class="gtitle">第 <span class="gno"></span> 組</span>
      <button type="button" class="link del-group">移除這組</button></div>`;
  }
  html += `<div class="step"><span class="n">1</span>${solo ? '你的資料' : '兩位成員'}</div><div class="members">`;
  for (let i = 0; i < count; i++) {
    html += `<div class="member" data-m="${i}">${tag(i)}
      <input type="text" class="p-name" placeholder="姓名" autocomplete="off">
      <input type="text" class="p-emp" placeholder="工號" autocomplete="off"></div>`;
  }
  html += '</div>';

  let soloNoteShown = false;
  Object.keys(STEP_TITLES).forEach(step => {
    const items = MENU.filter(it => String(it.step) === step);
    if (!items.length) return;
    const pairItems = items.filter(it => perOf(it) === 'pair');
    const personItems = items.filter(it => perOf(it) === 'person');

    html += `<div class="step"><span class="n">${step}</span>${STEP_TITLES[step]}</div>`;
    if (solo && !soloNoteShown && items.some(it => it.per === 'pair')) {
      soloNoteShown = true;
      html += `<p class="dlg-sub" style="margin:-4px 0 8px">套餐是兩人共用，福委會優先幫你找相同偏好的搭檔。</p>`;
    }
    if (pairItems.length) {
      html += `<div class="pair-fields"><div class="scope-note">👫 兩人共用一份</div>${pairItems.map(fieldHTML).join('')}</div>`;
    }
    if (personItems.length) {
      for (let i = 0; i < count; i++) {
        html += `<div class="person-fields" data-m="${i}">${
          solo ? '' : `<div class="pf-head">${tag(i)}<span class="mname">成員 ${'AB'[i]}</span></div>`
        }<div class="pf-grid">${personItems.map(fieldHTML).join('')}</div></div>`;
      }
    }
  });
  return html + '</fieldset>';
}

// 某位成員目前的所有選擇（共用項目 + 個人項目）
function valuesOf(group, m) {
  const vals = {};
  group.querySelectorAll('.pair-fields .field').forEach(f => vals[f.dataset.field] = readFieldEl(f));
  if (m != null) {
    group.querySelectorAll(`.person-fields[data-m="${m}"] .field`)
      .forEach(f => vals[f.dataset.field] = readFieldEl(f));
  }
  return vals;
}

function applySkips(group) {
  group.querySelectorAll('.field').forEach(f => {
    const it = menuItem(f.dataset.field);
    if (!it.skipIf) return;
    const pf = f.closest('.person-fields');
    const skip = isSkipped(it, valuesOf(group, pf ? pf.dataset.m : null));
    f.classList.toggle('skipped', skip);
    f.querySelectorAll('input, select').forEach(el => {
      el.disabled = skip;
      if (skip) { if (el.type === 'radio') el.checked = false; else el.value = ''; }
    });
  });
}

function maxGroups() {
  if (formMode === 'solo') return 1;
  const id = $('#tableSel').value;
  return id ? pairSlots(id) : MAX_UNSEATED_GROUPS;
}

function syncGroups() {
  const n = $('#groups').children.length;
  const max = maxGroups();
  const btn = $('#btnAddGroup');
  btn.hidden = formMode === 'solo' || n >= max;
  btn.textContent = $('#tableSel').value
    ? `+ 同桌再加一組（這桌還能再加 ${Math.max(0, max - n)} 組）`
    : '+ 再加一組';
  document.querySelectorAll('#groups .del-group').forEach(b => b.hidden = n <= 1);
  document.querySelectorAll('#groups .gno').forEach((s, i) => s.textContent = i + 1);
}

function addGroup(solo) {
  $('#groups').insertAdjacentHTML('beforeend', groupHTML(solo));
  syncGroups();
}

function fillTableSelect(selected) {
  const sel = $('#tableSel');
  sel.innerHTML = '<option value="">不指定桌次，由福委安排座位</option>' + TABLES.map(t => {
    const left = t.size - seatsUsed(t.id), slots = Math.floor(left / 2);
    return `<option value="${t.id}" ${slots ? '' : 'disabled'}>${t.id} 桌（${t.size} 人桌，${
      slots ? `剩 ${left} 位，可登記 ${slots} 組` : '已額滿'}）</option>`;
  }).join('');
  sel.value = selected || '';
}

function setMsg(text, cls) {
  const m = $('#msg');
  m.textContent = text;
  m.className = 'msg' + (cls ? ' ' + cls : '');
}

function openPair(tableId) {
  formMode = 'pair';
  $('#dlgTitle').textContent = '兩人一組登記';
  $('#dlgSub').textContent = '先找好搭檔。主餐套餐與海鮮兩人共用一份，飲品和甜點每人各選。整桌一起登記可以按下方「再加一組」。';
  $('#tableField').hidden = false;
  fillTableSelect(tableId);
  $('#groups').innerHTML = '';
  addGroup(false);
  setMsg('');
  dlg.showModal();

  // 背景抓最新座位，回來後更新桌次選單（保留使用者目前的選擇）
  refresh().then(() => {
    if (dlg.open && formMode === 'pair') { fillTableSelect($('#tableSel').value); syncGroups(); }
  });
}

function openSolo() {
  formMode = 'solo';
  $('#dlgTitle').textContent = '找不到搭檔？交由福委安排';
  $('#dlgSub').textContent = '填寫你的資料與餐點偏好，福委會幫你配對搭檔並安排座位。';
  $('#tableField').hidden = true;
  $('#tableSel').value = '';
  $('#groups').innerHTML = '';
  addGroup(true);
  setMsg('');
  dlg.showModal();
}

$('#groups').addEventListener('input', e => {
  if (!e.target.classList.contains('p-name')) return;
  const group = e.target.closest('.group');
  const m = e.target.closest('.member').dataset.m;
  const name = e.target.value.trim() || '成員 ' + 'AB'[m];
  group.querySelectorAll(`.person-fields[data-m="${m}"] .mname`).forEach(s => s.textContent = name);
});
$('#groups').addEventListener('change', e => applySkips(e.target.closest('.group')));
$('#groups').addEventListener('click', e => {
  if (!e.target.classList.contains('del-group')) return;
  e.target.closest('.group').remove();
  syncGroups();
});
$('#btnAddGroup').onclick = () => addGroup(false);
$('#tableSel').onchange = () => {
  syncGroups();
  const n = $('#groups').children.length, max = maxGroups();
  setMsg(n > max ? `這桌只能再登記 ${max} 組，請移除多出來的組別或換一桌` : '', n > max ? 'err' : '');
};

function readGroup(group, gi) {
  const solo = group.classList.contains('solo');
  const where = solo ? '' : `第 ${gi + 1} 組`;

  const members = [...group.querySelectorAll('.member')].map(mEl => {
    const m = mEl.dataset.m;
    const person = {
      name: mEl.querySelector('.p-name').value.trim(),
      empId: mEl.querySelector('.p-emp').value.trim(),
    };
    if (!person.name) throw new Error(solo ? '請填寫姓名' : `${where}成員 ${'AB'[m]} 還沒填姓名`);
    if (!person.empId) throw new Error(`${where}「${person.name}」還沒填工號`);

    Object.assign(person, valuesOf(group, m));
    MENU.forEach(it => {
      if (isSkipped(it, person)) { person[it.key] = ''; return; }
      if (!person[it.key]) {
        throw new Error(!solo && it.per === 'pair'
          ? `${where}還沒選「${it.label}」`
          : `${where}「${person.name}」還沒選「${it.label}」`);
      }
    });
    return person;
  });
  return { members };
}

function collectForm() {
  const groupEls = [...$('#groups').children];
  if (!groupEls.length) throw new Error('請至少登記一組');
  const groups = groupEls.map(readGroup);
  const people = groups.flatMap(g => g.members);

  const ids = people.map(p => p.empId);
  const dup = ids.find((id, i) => ids.indexOf(id) !== i);
  if (dup) throw new Error(`工號 ${dup} 重複填寫了`);

  const taken = bookings.find(b => ids.includes(b.empId));
  if (taken) {
    throw new Error(`工號 ${taken.empId}（${taken.name}）已經登記過${
      taken.tableId ? ' ' + taken.tableId + ' 桌' : '（交由福委安排）'}，請先取消原登記`);
  }

  const tableId = formMode === 'solo' ? null : ($('#tableSel').value || null);
  if (tableId) {
    const left = tableById(tableId).size - seatsUsed(tableId);
    if (people.length > left) throw new Error(`${tableId} 桌只剩 ${left} 個位子，這次要登記 ${people.length} 位`);
  }
  return { tableId, groups };
}

$('#btnSubmit').onclick = async () => {
  if (busy) return;
  let payload;
  try { payload = collectForm(); }
  catch (e) { setMsg('⚠️ ' + e.message, 'err'); return; }

  busy = true;
  $('#btnSubmit').disabled = true;
  setMsg('送出中…');
  try {
    const r = await api('book', payload);
    setBookings(r.bookings);
    render();
    dlg.close();
    showDone(r.code, payload);
  } catch (e) {
    setMsg('⚠️ ' + e.message, 'err');
    await refresh();          // 可能是別人先搶走了，拉最新狀態
    if (formMode === 'pair') { fillTableSelect($('#tableSel').value); syncGroups(); }
  } finally {
    busy = false;
    $('#btnSubmit').disabled = false;
  }
};

/* ---------------- 登記完成 ---------------- */

const dlgDone = $('#dlgDone');
// 不允許按 Esc 關閉，一定要按「確認」，避免預約碼一閃而過
dlgDone.addEventListener('cancel', e => e.preventDefault());
$('#btnDoneOk').onclick = () => dlgDone.close();

function showDone(code, payload) {
  $('#doneCode').textContent = code;
  $('#btnCopy').textContent = '複製預約碼';

  const where = payload.tableId
    ? `${payload.tableId} 桌`
    : formMode === 'solo' ? '待福委配對搭檔與安排座位' : '由福委安排座位';

  $('#doneDetail').innerHTML = `<div class="dd-where">📍 ${esc(where)}</div>` +
    payload.groups.map((g, i) => `
      ${g.members.length === 2 ? `<div class="dd-head">第 ${i + 1} 組</div>` : ''}
      ${g.members.map(m => `<div class="dd-row"><b>${esc(m.name)}</b>
        <span class="muted">${esc(m.empId)}</span><br>
        <span class="muted">${MENU.map(it => m[it.key]).filter(Boolean).map(esc).join('・')}</span></div>`
      ).join('')}`).join('');

  dlgDone.showModal();
  $('#btnDoneOk').focus();
}

$('#btnCopy').onclick = async () => {
  const code = $('#doneCode').textContent;
  try {
    await navigator.clipboard.writeText(code);
    $('#btnCopy').textContent = '已複製 ✓';
  } catch (e) {
    const range = document.createRange();
    range.selectNodeContents($('#doneCode'));
    getSelection().removeAllRanges();
    getSelection().addRange(range);
    $('#btnCopy').textContent = '已選取，請按 Ctrl+C';
  }
};

/* ---------------- 取消 ---------------- */

const dlgCancel = $('#dlgCancel');
$('#btnCancel').onclick = () => {
  $('#cancelMsg').textContent = '';
  $('#cancelCode').value = '';
  dlgCancel.showModal();
};
$('#btnDoCancel').onclick = async () => {
  const code = $('#cancelCode').value.trim().toUpperCase();
  const m = $('#cancelMsg');
  if (!code) { m.textContent = '⚠️ 請輸入預約碼'; m.className = 'msg err'; return; }
  try {
    const r = await api('cancel', { code });
    setBookings(r.bookings);
    render();
    m.textContent = `✅ 已取消 ${r.removed} 位的登記`;
    m.className = 'msg ok';
  } catch (e) {
    m.textContent = '⚠️ ' + e.message;
    m.className = 'msg err';
  }
};

/* ---------------- 其他 ---------------- */

$('#btnPair').onclick = () => openPair('');
$('#btnSolo').onclick = () => openSolo();

$('#grid').addEventListener('click', e => {
  const btn = e.target.closest('[data-book]');
  if (btn && !btn.disabled) openPair(btn.dataset.book);
});

document.querySelectorAll('.chipbtn[data-filter]').forEach(b => {
  b.onclick = () => {
    filter = b.dataset.filter;
    document.querySelectorAll('.chipbtn[data-filter]')
      .forEach(x => x.setAttribute('aria-pressed', x === b));
    render();
  };
});

document.querySelectorAll('[data-close]').forEach(b => {
  b.onclick = () => b.closest('dialog').close();
});

refresh();
// 每 60 秒同步一次（頁面沒在看時暫停）；切回頁面時會立刻更新
autoRefresh(refresh, 60000, () => !dlg.open && !busy);
</script>
</body>
</html>
